server {
    listen 80 default_server;
    server_name _;
    root /var/www/backend/public;
    index index.php;

    # Sized for the account backup archive upload (Obnova zo zálohy) — it
    # carries every photo and PDF the account owns, so the old 32m ceiling
    # rejected any real backup before PHP ever saw it. Must stay >= the
    # post_max_size set in docker/php/Dockerfile.
    client_max_body_size 1024m;

    # A large restore is a single long request; don't cut it off mid-upload.
    client_body_timeout 900s;
    fastcgi_read_timeout 900s;

    # CORS pre Vite dev server (ľubovoľný localhost port — Vite si posunie
    # port keď 5173 obsadí iný projekt) — len v dev. Na produkcii to nebude.
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;

    # Security headers (dev parity with .htaccess). HSTS omitted on purpose —
    # dev runs over plain http.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Skry citlivé súbory.
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(env|log|ini|neon)$ { deny all; }
}
